name: DigiBoard CI

on:
  push:
    branches: [ main, master ]
  # Every pull request, including ones stacked on other branches.
  pull_request:

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    - run: npm ci
    # No --if-present: a missing test script must fail the build.
    - run: npm test
    # Production dependencies must have no known high or critical advisories.
    - run: npm audit --omit=dev --audit-level=high

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        # Must satisfy the Dart SDK constraint in pubspec.yaml (^3.9.0).
        flutter-version: '3.35.5'
        channel: 'stable'
    - run: flutter pub get
    # The analyzer is clean: any new error, warning or info fails the build.
    - run: flutter analyze
    - run: flutter test

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Backend
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        push: false
        tags: digiboard-backend:latest

    - name: Build Frontend
      uses: docker/build-push-action@v6
      with:
        context: ./frontend
        push: false
        tags: digiboard-frontend:latest
