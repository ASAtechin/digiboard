<!DOCTYPE html>
<html>
<head>
    <title>Test DigiBoard Today Schedule</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .lecture { border: 1px solid #ccc; margin: 10px 0; padding: 15px; border-radius: 8px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>DigiBoard Today Schedule Test</h1>
    <button onclick="loadTodaySchedule()">Load Today's Schedule</button>
    <div id="status"></div>
    <div id="lectures"></div>

    <script>
        async function loadTodaySchedule() {
            const statusDiv = document.getElementById('status');
            const lecturesDiv = document.getElementById('lectures');
            
            statusDiv.innerHTML = '<div class="success">Loading...</div>';
            lecturesDiv.innerHTML = '';
            
            try {
                const response = await fetch('https://web-production-1e39.up.railway.app/api/schedule/today', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const lectures = await response.json();
                console.log('Received lectures:', lectures);
                
                statusDiv.innerHTML = `<div class="success">✅ Found ${lectures.length} lectures for today</div>`;
                
                if (lectures.length === 0) {
                    lecturesDiv.innerHTML = '<div>No lectures scheduled for today</div>';
                    return;
                }
                
                lectures.forEach((lecture, index) => {
                    const startTime = new Date(lecture.startTime);
                    const endTime = new Date(lecture.endTime);
                    const timeRange = `${startTime.toLocaleTimeString()} - ${endTime.toLocaleTimeString()}`;
                    
                    lecturesDiv.innerHTML += `
                        <div class="lecture">
                            <h3>${lecture.subject || 'No Subject'}</h3>
                            <p><strong>Teacher:</strong> ${lecture.teacher?.name || 'Unknown'}</p>
                            <p><strong>Classroom:</strong> ${lecture.classroom || 'TBD'}</p>
                            <p><strong>Time:</strong> ${timeRange}</p>
                            <p><strong>Type:</strong> ${lecture.lectureType || 'Lecture'}</p>
                            <p><strong>Chapter:</strong> ${lecture.chapter || 'N/A'}</p>
                            <p><strong>Course:</strong> ${lecture.course || 'N/A'}</p>
                        </div>
                    `;
                });
                
            } catch (error) {
                console.error('Error loading schedule:', error);
                statusDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
        
        // Auto-load when page loads
        window.addEventListener('load', loadTodaySchedule);
    </script>
</body>
</html>
