<!DOCTYPE html>
<html>
<head>
    <title>DigiBoard API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { border-color: green; background-color: #f0fff0; }
        .error { border-color: red; background-color: #fff0f0; }
        button { padding: 10px 20px; margin: 10px; }
        pre { white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>DigiBoard API Test - September 16, 2025</h1>
    
    <button onclick="testToday()">Test Today's Schedule</button>
    <button onclick="testNext()">Test Next Lecture</button>
    <button onclick="testHealth()">Test Backend Health</button>
    
    <div id="results"></div>

    <script>
        const API_BASE = 'https://web-production-58f13.up.railway.app/api';
        
        async function testAPI(endpoint, title) {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = 'result';
            resultDiv.innerHTML = `<h3>${title}</h3><p>Loading...</p>`;
            resultsDiv.appendChild(resultDiv);
            
            try {
                console.log(`Testing: ${API_BASE}${endpoint}`);
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                console.log(`Response status: ${response.status}`);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log(`Response data:`, data);
                    
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>${title} ✅</h3>
                        <p><strong>Status:</strong> ${response.status} OK</p>
                        <p><strong>Data Type:</strong> ${Array.isArray(data) ? `Array (${data.length} items)` : typeof data}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    const errorText = await response.text();
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <h3>${title} ❌</h3>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Error:</strong> ${errorText}</p>
                    `;
                }
            } catch (error) {
                console.error('Error:', error);
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>${title} ❌</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p>Check browser console for details</p>
                `;
            }
        }
        
        function testToday() {
            testAPI('/schedule/today', 'Today\'s Schedule');
        }
        
        function testNext() {
            testAPI('/schedule/next', 'Next Lecture');
        }
        
        function testHealth() {
            testAPI('/health', 'Backend Health', 'https://web-production-58f13.up.railway.app');
        }
        
        // Auto-run tests on page load
        window.onload = function() {
            console.log('Current time:', new Date().toISOString());
            console.log('Testing DigiBoard APIs...');
            setTimeout(() => testHealth(), 500);
            setTimeout(() => testToday(), 1000);
            setTimeout(() => testNext(), 1500);
        };
    </script>
</body>
</html>
